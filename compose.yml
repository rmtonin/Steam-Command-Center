services:
  stream-command-center:
    build: .
    container_name: stream-command-center
    restart: unless-stopped
    ports: ["6767:6767"]
    environment:
      PORT: 6767
      DATA_DIRECTORY: /data
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes: ["stream-command-data:/data"]
volumes:
  stream-command-data:
