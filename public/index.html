<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream Command Center</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><div><small>LIVE OPERATIONS</small><h1>Stream Command Center</h1></div><button id="settings">OBS Settings</button></header><p id="error"></p><section class="hero"><div><b id="live">○ STANDBY</b><h2 id="total">0</h2><span>combined viewers</span></div><div><span>Session time</span><h3 id="time">00:00:00</h3></div></section><section class="grid"><article><b>TWITCH</b><h3 id="tw-state">Not configured</h3><div class="metrics"><label>Watching<strong id="tw-viewers">0</strong></label><label>Followers<strong id="tw-followers">0</strong></label></div><p id="tw-title"></p></article><article><b>YOUTUBE</b><h3 id="yt-state">Not configured</h3><div class="metrics"><label>Watching<strong id="yt-viewers">0</strong></label><label>Subscribers<strong id="yt-subs">0</strong></label></div><p id="yt-title"></p></article></section><article><b>OBS HEALTH</b><div class="health"><label>FPS<strong id="fps">0</strong></label><label>CPU<strong id="cpu">0%</strong></label><label>Memory<strong id="memory">0 MB</strong></label><label>Render lag<strong id="render">0%</strong></label><label>Encoding lag<strong id="encode">0%</strong></label><label>Output<strong id="output">Stopped</strong></label></div></article></main><dialog id="modal"><form id="form"><h3>OBS WebSocket</h3><label>URL<input id="url" value="ws://127.0.0.1:4455"></label><label>Password<input id="password" type="password"></label><label>Refresh seconds<input id="poll" type="number" min="5" value="10"></label><div><button type="button" id="close">Cancel</button><button>Save</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
