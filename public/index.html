<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream Command Center</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="dashboard">
<header><div class="brand"><span></span><b>LIVE CONTROL</b></div><div class="header-actions"><span id="obs-status" data-state="disconnected">OBS disconnected</span><button id="settings" class="circle" aria-label="Settings">•••</button></div></header>
<p id="error" class="error" hidden></p>
<section class="hero glass"><div><b id="live">○ STANDBY</b><strong id="total">0</strong></div><svg class="chart hero-chart" viewBox="0 0 210 54" preserveAspectRatio="none"><polyline id="total-chart" points="0,48 210,48"/></svg><div class="session"><span>SESSION</span><strong id="time">00:00:00</strong></div></section>
<section class="platforms">
<article class="platform glass twitch"><i id="tw-light" class="live-dot"></i><div class="logo"><svg viewBox="0 0 24 24"><path d="M4 2h18v13l-5 5h-4l-3 3v-3H4V2zm2 2v14h6v2l2-2h3l3-3V4H6zm5 3h2v6h-2V7zm5 0h2v6h-2V7z"/></svg></div><div class="primary"><strong id="tw-viewers">0</strong></div><div class="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22c0-5 3-8 8-8s8 3 8 8z"/></svg><strong id="tw-followers">0</strong></div><svg class="chart mini" viewBox="0 0 180 35" preserveAspectRatio="none"><polyline id="twitch-chart" points="0,30 180,30"/></svg><span id="tw-state" hidden></span><p id="tw-title" hidden></p></article>
<article class="platform glass youtube"><i id="yt-light" class="live-dot"></i><div class="logo"><svg viewBox="0 0 24 24"><path d="M23 7.2s-.2-1.7-.9-2.4c-.9-.9-1.9-.9-2.4-1C16.4 3.5 12 3.5 12 3.5s-4.4 0-7.7.3c-.5.1-1.5.1-2.4 1C1.2 5.5 1 7.2 1 7.2S.7 9.2.7 11.1v1.8c0 2 .3 3.9.3 3.9s.2 1.7.9 2.4c.9.9 2.1.9 2.6 1 1.9.2 7.5.3 7.5.3s4.4 0 7.7-.3c.5-.1 1.5-.1 2.4-1 .7-.7.9-2.4.9-2.4s.3-2 .3-3.9v-1.8c0-2-.3-3.9-.3-3.9zM9.8 15.6V8.8l6 3.4-6 3.4z"/></svg></div><div class="primary"><strong id="yt-viewers">0</strong></div><div class="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22c0-5 3-8 8-8s8 3 8 8z"/></svg><strong id="yt-subs">0</strong></div><svg class="chart mini" viewBox="0 0 180 35" preserveAspectRatio="none"><polyline id="youtube-chart" points="0,30 180,30"/></svg><button id="find-youtube-event" class="event" title="Find next YouTube event" aria-label="Find next YouTube event">↻</button><span id="yt-state" hidden></span><span id="yt-mode" hidden></span><p id="yt-title" hidden></p></article>
</section>
<section class="obs glass"><div class="obs-logo"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"/><path d="M31 8c10 0 18 8 18 18 0 2-.4 4-1 6-2-6-7-10-14-10-5 0-10 3-12 8-5-3-8-8-8-14 0-3 1-6 2-8 4 0 9 0 15 0zm18 26c5 9 2 20-7 25-2 1-4 2-6 2 4-5 5-12 1-18-3-5-8-8-14-8 0-6 3-12 8-15 3-2 6-2 9-2 2 4 5 9 9 16zM29 58C19 58 11 50 11 40c0-2 .4-4 1-6 2 6 7 10 14 10 5 0 10-3 12-8 5 3 8 8 8 14 0 3-1 6-2 8-5 0-10 0-15 0z"/></svg></div><div class="gauge" id="cpu-gauge"><svg class="metric-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg><strong id="cpu">0%</strong></div><div class="gauge" id="memory-gauge"><svg class="metric-icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="11" rx="2"/><path d="M7 9v5M10 9v5M13 9v5M16 9v5M6 17v3M10 17v3M14 17v3M18 17v3"/></svg><strong id="memory">0 MB</strong></div><div class="lag"><label>R<strong id="render">0%</strong></label><label>E<strong id="encode">0%</strong></label></div><div class="output"><span>OUTPUT</span><strong id="output">Stopped</strong></div><svg class="chart obs-chart" viewBox="0 0 235 35" preserveAspectRatio="none"><polyline id="obs-chart" points="0,30 235,30"/></svg><button id="refresh" class="refresh" aria-label="Refresh">↻</button></section>
</main>
<dialog id="modal"><form id="form"><div class="dialog-head"><b>SETTINGS</b><button id="close" type="button" class="circle">×</button></div><div class="form-grid"><label>Twitch channel<input id="twitch-channel"></label><label>YouTube channel ID<input id="youtube-channel-id"></label><label>OBS URL<input id="url" value="ws://127.0.0.1:4455"></label><label>OBS password<input id="password" type="password"></label><label>Refresh seconds<input id="poll" type="number" min="5" value="10"></label></div><div class="actions"><button id="clear" type="button">Clear</button><button>Save</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
